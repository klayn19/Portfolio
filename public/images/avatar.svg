<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Purple Circle Background matching reference image -->
  <circle cx="200" cy="200" r="190" fill="#7C3AED" />
  
  <defs>
    <!-- Clip path to keep body inside the circle -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="190" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- T-Shirt / Shoulders -->
    <path d="M 80 400 C 80 330, 130 310, 200 310 C 270 310, 320 330, 320 400 Z" fill="#374151" />
    
    <!-- Shirt Collar / Neckline -->
    <path d="M 165 315 C 165 335, 235 335, 235 315" fill="#374151" stroke="#1F2937" stroke-width="4" />
    
    <!-- Neck -->
    <rect x="172" y="240" width="56" height="80" rx="8" fill="#F6B898" />
    <!-- Neck Shadow under chin -->
    <path d="M 172 260 C 185 275, 215 275, 228 260 L 228 275 C 215 290, 185 290, 172 275 Z" fill="#E5A07E" opacity="0.6" />

    <!-- Ears -->
    <ellipse cx="140" cy="210" rx="14" ry="18" fill="#F6B898" />
    <ellipse cx="140" cy="210" rx="7" ry="10" fill="#E5A07E" />
    <ellipse cx="260" cy="210" rx="14" ry="18" fill="#F6B898" />
    <ellipse cx="260" cy="210" rx="7" ry="10" fill="#E5A07E" />

    <!-- Face Base -->
    <ellipse cx="200" cy="210" rx="65" ry="72" fill="#F6B898" />

    <!-- Eyebrows -->
    <path d="M 160 172 Q 172 166 182 172" stroke="#2B1810" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 218 172 Q 228 166 240 172" stroke="#2B1810" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Glasses - Left Rim -->
    <circle cx="170" cy="195" r="24" fill="#FFFFFF" fill-opacity="0.15" stroke="#1F2937" stroke-width="7" />
    <!-- Glasses - Right Rim -->
    <circle cx="230" cy="195" r="24" fill="#FFFFFF" fill-opacity="0.15" stroke="#1F2937" stroke-width="7" />
    <!-- Glasses Bridge -->
    <path d="M 194 193 Q 200 188 206 193" stroke="#1F2937" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Glasses Temple sides -->
    <path d="M 146 193 L 132 190" stroke="#1F2937" stroke-width="6" stroke-linecap="round" />
    <path d="M 254 193 L 268 190" stroke="#1F2937" stroke-width="6" stroke-linecap="round" />

    <!-- Eyes (pupils behind glasses) -->
    <circle cx="170" cy="195" r="5" fill="#1F2937" />
    <circle cx="230" cy="195" r="5" fill="#1F2937" />
    <!-- Eye highlights -->
    <circle cx="168" cy="193" r="1.5" fill="#FFFFFF" />
    <circle cx="228" cy="193" r="1.5" fill="#FFFFFF" />

    <!-- Cute Nose -->
    <path d="M 197 212 C 198 220, 202 220, 203 212" stroke="#E5A07E" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Cheerful Smile -->
    <path d="M 184 235 Q 200 252 216 235" stroke="#1F2937" stroke-width="4" stroke-linecap="round" fill="#1F2937" />
    <!-- Tongue / Smile detail -->
    <path d="M 190 242 Q 200 249 210 242" fill="#E11D48" />

    <!-- Hair (Stylish brown quiff matching the guide image) -->
    <path d="M 136 195 
             C 130 160, 142 125, 175 115 
             C 190 110, 215 105, 235 90 
             C 245 80, 255 88, 252 102 
             C 250 112, 260 115, 266 125 
             C 275 140, 275 165, 265 195 
             C 260 170, 245 150, 235 152 
             C 220 155, 195 145, 175 155 
             C 155 165, 145 180, 136 195 Z" 
          fill="#8B4513" />

    <!-- Hair highlight/texture -->
    <path d="M 175 125 Q 215 115 240 98" stroke="#A0522D" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
</svg>
