<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 900" fill="none">
  <defs>
    <!-- Dot pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#6366F1" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Left Dot Grid Area -->
  <rect x="40" y="220" width="160" height="260" fill="url(#dotGrid)" rx="8" />

  <!-- Right Dot Grid Area -->
  <rect x="1240" y="220" width="160" height="260" fill="url(#dotGrid)" rx="8" />

  <!-- Floating subtle shapes Left side -->
  <polygon points="110,120 125,145 95,145" fill="#6366F1" fill-opacity="0.07" transform="rotate(15 110 132)" />
  <polygon points="180,380 200,415 160,415" fill="#8B5CF6" fill-opacity="0.06" transform="rotate(-25 180 397)" />
  <rect x="70" y="520" width="18" height="18" rx="4" fill="#3B82F6" fill-opacity="0.08" transform="rotate(45 79 529)" />
  <circle cx="230" cy="190" r="6" fill="#A855F7" fill-opacity="0.12" />
  <circle cx="150" cy="620" r="10" fill="#6366F1" fill-opacity="0.08" />

  <!-- Floating subtle shapes Center & Right side -->
  <polygon points="1280,130 1300,165 1260,165" fill="#EC4899" fill-opacity="0.07" transform="rotate(35 1280 147)" />
  <polygon points="1180,480 1205,518 1155,518" fill="#3B82F6" fill-opacity="0.07" transform="rotate(12 1180 499)" />
  <rect x="1330" y="520" width="22" height="22" rx="5" fill="#8B5CF6" fill-opacity="0.08" transform="rotate(30 1341 531)" />
  <circle cx="1180" cy="180" r="7" fill="#6366F1" fill-opacity="0.1" />
  <circle cx="1290" cy="630" r="12" fill="#3B82F6" fill-opacity="0.07" />

  <!-- Floating subtle shapes in Hero Background -->
  <polygon points="420,160 435,185 405,185" fill="#8B5CF6" fill-opacity="0.06" transform="rotate(40 420 172)" />
  <polygon points="980,180 995,205 965,205" fill="#6366F1" fill-opacity="0.06" transform="rotate(-15 980 192)" />
  <polygon points="460,560 480,590 440,590" fill="#3B82F6" fill-opacity="0.06" transform="rotate(20 460 575)" />
  <polygon points="960,580 985,615 935,615" fill="#A855F7" fill-opacity="0.06" transform="rotate(-30 960 597)" />
</svg>
