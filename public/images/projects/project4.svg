<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad4)"/>
  
  <!-- Code & API Explorer Mockup -->
  <g filter="url(#shadow4)">
    <rect x="70" y="55" width="660" height="390" rx="14" fill="#18181B"/>
    <rect x="70" y="55" width="660" height="42" rx="14" fill="#27272A"/>
    <circle cx="95" cy="76" r="6" fill="#EF4444"/>
    <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="76" r="6" fill="#10B981"/>
    <text x="400" y="80" text-anchor="middle" font-family="monospace" font-size="12" fill="#D4956A">CoffeeShop_Inventory.py · CustomTkinter GUI</text>

    <!-- Main Window Background -->
    <rect x="100" y="115" width="600" height="305" rx="8" fill="#181310"/>
    
    <!-- Top Bar inside app -->
    <rect x="115" y="130" width="570" height="40" rx="6" fill="#2C1810"/>
    <text x="135" y="155" font-family="system-ui" font-weight="bold" font-size="14" fill="#F5E6D3">☕ Coffee Shop Menu &amp; Stock Manager</text>
    <rect x="560" y="138" width="110" height="24" rx="4" fill="#6F4E37"/>
    <text x="615" y="154" text-anchor="middle" font-family="system-ui" font-size="11" fill="#FFFFFF">+ Add Product</text>

    <!-- Product Cards Grid -->
    <rect x="115" y="185" width="175" height="105" rx="6" fill="#261C16" stroke="#4A3528"/>
    <rect x="125" y="195" width="45" height="45" rx="4" fill="#6F4E37"/>
    <text x="147" y="222" text-anchor="middle" font-size="18">☕</text>
    <text x="180" y="210" font-family="system-ui" font-weight="bold" font-size="12" fill="#F5E6D3">Espresso</text>
    <text x="180" y="226" font-family="system-ui" font-size="11" fill="#C4956A">₱120 · Code: C001</text>
    <text x="125" y="265" font-family="system-ui" font-size="10" fill="#10B981">● In Stock: 45 cups</text>

    <rect x="312" y="185" width="175" height="105" rx="6" fill="#261C16" stroke="#4A3528"/>
    <rect x="322" y="195" width="45" height="45" rx="4" fill="#6F4E37"/>
    <text x="344" y="222" text-anchor="middle" font-size="18">🧋</text>
    <text x="377" y="210" font-family="system-ui" font-weight="bold" font-size="12" fill="#F5E6D3">Caramel Latte</text>
    <text x="377" y="226" font-family="system-ui" font-size="11" fill="#C4956A">₱165 · Code: C002</text>
    <text x="322" y="265" font-family="system-ui" font-size="10" fill="#10B981">● In Stock: 32 cups</text>

    <rect x="510" y="185" width="175" height="105" rx="6" fill="#261C16" stroke="#4A3528"/>
    <rect x="520" y="195" width="45" height="45" rx="4" fill="#6F4E37"/>
    <text x="542" y="222" text-anchor="middle" font-size="18">🧊</text>
    <text x="575" y="210" font-family="system-ui" font-weight="bold" font-size="12" fill="#F5E6D3">Cold Brew</text>
    <text x="575" y="226" font-family="system-ui" font-size="11" fill="#C4956A">₱150 · Code: C003</text>
    <text x="520" y="265" font-family="system-ui" font-size="10" fill="#F59E0B">▲ Low Stock: 8 cups</text>

    <!-- Table preview at bottom -->
    <rect x="115" y="305" width="570" height="100" rx="6" fill="#261C16"/>
    <text x="135" y="330" font-family="monospace" font-size="11" fill="#D4956A">SQLite Table: ingredients | Coffee Beans: 12.5 kg | Milk: 24 L | Syrups: 6 bottles</text>
    <text x="135" y="355" font-family="monospace" font-size="11" fill="#94A3B8">Transaction Log #1042: Sold 2x Caramel Latte (₱330.00) — Payment: Cash</text>
    <text x="135" y="380" font-family="monospace" font-size="11" fill="#34D399">Status: SQLite DB Connected (CoffeeShop_DB.sqlite) — All systems operational</text>
  </g>
</svg>
