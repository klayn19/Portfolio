<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  
  <!-- App Window Mockup -->
  <g filter="url(#shadow1)">
    <rect x="70" y="55" width="660" height="390" rx="14" fill="#FFFFFF"/>
    <!-- Window Bar -->
    <rect x="70" y="55" width="660" height="42" rx="14" fill="#F3F4F6"/>
    <rect x="70" y="85" width="660" height="12" fill="#F3F4F6"/>
    <circle cx="95" cy="76" r="6" fill="#EF4444"/>
    <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="76" r="6" fill="#10B981"/>
    
    <!-- URL pill -->
    <rect x="220" y="66" width="360" height="20" rx="10" fill="#E5E7EB"/>
    <text x="400" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">cos.localhost/dashboard</text>

    <!-- Sidebar -->
    <rect x="70" y="97" width="140" height="348" fill="#F8FAFC"/>
    <rect x="90" y="120" width="100" height="16" rx="4" fill="#6366F1"/>
    <rect x="90" y="150" width="80" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="90" y="175" width="90" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="90" y="200" width="70" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="90" y="225" width="85" height="12" rx="3" fill="#E2E8F0"/>

    <!-- Dashboard Content -->
    <text x="240" y="135" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#1E293B">COS_LARAVEL · Clash of Subjects</text>
    <text x="240" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Gamified Learning, Teacher &amp; Student Dashboards, Unity Game API</text>

    <!-- Stat cards -->
    <rect x="240" y="175" width="140" height="70" rx="8" fill="#EEF2FF"/>
    <text x="255" y="200" font-family="system-ui" font-size="12" fill="#6366F1">Total Quizzes</text>
    <text x="255" y="228" font-family="system-ui" font-weight="bold" font-size="18" fill="#1E1B4B">Active</text>

    <rect x="400" y="175" width="140" height="70" rx="8" fill="#ECFDF5"/>
    <text x="415" y="200" font-family="system-ui" font-size="12" fill="#10B981">Unity API</text>
    <text x="415" y="228" font-family="system-ui" font-weight="bold" font-size="18" fill="#064E3B">Connected</text>

    <rect x="560" y="175" width="140" height="70" rx="8" fill="#FEF3C7"/>
    <text x="575" y="200" font-family="system-ui" font-size="12" fill="#D97706">Sections</text>
    <text x="575" y="228" font-family="system-ui" font-weight="bold" font-size="18" fill="#78350F">Enrolled</text>

    <!-- Product Grid Preview -->
    <rect x="240" y="265" width="140" height="155" rx="8" fill="#F1F5F9"/>
    <circle cx="310" cy="320" r="30" fill="#CBD5E1"/>
    <rect x="255" y="370" width="110" height="12" rx="3" fill="#94A3B8"/>
    <rect x="255" y="390" width="60" height="12" rx="3" fill="#6366F1"/>

    <rect x="400" y="265" width="140" height="155" rx="8" fill="#F1F5F9"/>
    <circle cx="470" cy="320" r="30" fill="#CBD5E1"/>
    <rect x="415" y="370" width="110" height="12" rx="3" fill="#94A3B8"/>
    <rect x="415" y="390" width="60" height="12" rx="3" fill="#6366F1"/>

    <rect x="560" y="265" width="140" height="155" rx="8" fill="#F1F5F9"/>
    <circle cx="630" cy="320" r="30" fill="#CBD5E1"/>
    <rect x="575" y="370" width="110" height="12" rx="3" fill="#94A3B8"/>
    <rect x="575" y="390" width="60" height="12" rx="3" fill="#6366F1"/>
  </g>
</svg>
