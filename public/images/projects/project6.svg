<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad6)"/>
  
  <g filter="url(#shadow6)">
    <rect x="70" y="55" width="660" height="390" rx="14" fill="#0F172A"/>
    <rect x="70" y="55" width="660" height="42" rx="14" fill="#1E293B"/>
    <circle cx="95" cy="76" r="6" fill="#EF4444"/>
    <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="76" r="6" fill="#10B981"/>
    <text x="400" y="80" text-anchor="middle" font-family="system-ui" font-size="11" fill="#94A3B8">chat.nova-ai.io</text>

    <!-- Chat Messages -->
    <rect x="100" y="125" width="400" height="60" rx="10" fill="#1E293B"/>
    <text x="120" y="150" font-family="system-ui" font-size="12" fill="#E2E8F0">Can you optimize this database query for high traffic?</text>
    <text x="120" y="170" font-family="system-ui" font-size="10" fill="#64748B">User · 10:42 AM</text>

    <rect x="240" y="200" width="460" height="120" rx="10" fill="#1E3A8A"/>
    <text x="260" y="225" font-family="system-ui" font-weight="bold" font-size="12" fill="#93C5FD">AI Assistant</text>
    <text x="260" y="250" font-family="system-ui" font-size="12" fill="#DBEAFE">Here is an indexed query plan using Eloquent chunking & Redis:</text>
    <rect x="260" y="265" width="420" height="40" rx="6" fill="#0F172A"/>
    <text x="275" y="290" font-family="monospace" font-size="11" fill="#38BDF8">User::select('id', 'name')->lazyById(500);</text>

    <!-- Chat input bar -->
    <rect x="100" y="360" width="600" height="50" rx="25" fill="#1E293B" stroke="#334155"/>
    <text x="130" y="390" font-family="system-ui" font-size="13" fill="#64748B">Ask Nova anything about your codebase...</text>
    <circle cx="670" cy="385" r="16" fill="#38BDF8"/>
    <polygon points="665,378 678,385 665,392" fill="#0F172A"/>
  </g>
</svg>
