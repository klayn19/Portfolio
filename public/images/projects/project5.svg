    <!-- Two columns below -->
    <rect x="290" y="265" width="180" height="125" rx="8" fill="#FFFFFF"/>
    <circle cx="330" cy="300" r="18" fill="#FCE7F3"/>
    <rect x="310" y="330" width="140" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="310" y="350" width="90" height="10" rx="2" fill="#E2E8F0"/>

    <rect x="490" y="265" width="180" height="125" rx="8" fill="#FFFFFF"/>
    <circle cx="530" cy="300" r="18" fill="#EDE9FE"/>
    <rect x="510" y="330" width="140" height="10" rx="2" fill="#E2E8F0"/>
    <rect x="510" y="350" width="90" height="10" rx="2" fill="#E2E8F0"/>
