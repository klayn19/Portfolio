<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad5)"/>
  
  <g filter="url(#shadow5)">
    <rect x="70" y="55" width="660" height="390" rx="14" fill="#FFFFFF"/>
    <rect x="70" y="55" width="660" height="42" rx="14" fill="#F3F4F6"/>
    <circle cx="95" cy="76" r="6" fill="#EF4444"/>
    <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="76" r="6" fill="#10B981"/>
    <text x="400" y="80" text-anchor="middle" font-family="system-ui" font-size="11" fill="#6B7280">design.studio-craft.net</text>

    <!-- Visual Editor UI -->
    <rect x="100" y="120" width="140" height="295" rx="8" fill="#F8FAFC"/>
    <text x="120" y="145" font-family="system-ui" font-weight="bold" font-size="12" fill="#334155">Components</text>
    <rect x="115" y="160" width="110" height="28" rx="4" fill="#EEF2FF"/>
    <text x="130" y="178" font-family="system-ui" font-size="11" fill="#4F46E5">+ Hero Banner</text>
    <rect x="115" y="196" width="110" height="28" rx="4" fill="#F1F5F9"/>
    <text x="130" y="214" font-family="system-ui" font-size="11" fill="#475569">+ Gallery Grid</text>
