    <text x="130" y="250" font-family="system-ui" font-size="11" fill="#475569">+ Pricing Table</text>

    <!-- Canvas -->
    <rect x="260" y="120" width="440" height="295" rx="8" fill="#FDF2F8" stroke="#F472B6" stroke-dasharray="4 4"/>
    <rect x="290" y="150" width="380" height="100" rx="8" fill="#FFFFFF"/>
    <text x="310" y="185" font-family="system-ui" font-weight="bold" font-size="16" fill="#831843">Build Modern Web Experiences</text>
    <text x="310" y="205" font-family="system-ui" font-size="11" fill="#9D174D">Drag and drop visual builder powered by Tailwind & Blade.</text>
