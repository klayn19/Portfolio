<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <g filter="url(#shadow2)">
    <rect x="70" y="55" width="660" height="390" rx="14" fill="#0B132B"/>
    <rect x="70" y="55" width="660" height="42" rx="14" fill="#1C2541"/>
    <rect x="70" y="85" width="660" height="12" fill="#1C2541"/>
    <circle cx="95" cy="76" r="6" fill="#EF4444"/>
    <circle cx="115" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="76" r="6" fill="#10B981"/>
    <text x="400" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">sam.localhost/dashboard</text>

    <!-- Header bar inside -->
    <text x="100" y="130" font-family="system-ui" font-weight="bold" font-size="18" fill="#F8FAFC">SAM · Student Achievement Monitoring</text>
    <text x="100" y="150" font-family="system-ui" font-size="12" fill="#64748B">RFID Attendance, Grade Reports, Multi-Role Dashboard (Admin/Teacher/Student)</text>

    <!-- Metric blocks -->
    <rect x="100" y="170" width="160" height="65" rx="8" fill="#1C2541"/>
    <text x="115" y="195" font-family="system-ui" font-size="11" fill="#38BDF8">RFID Scanner</text>
    <text x="115" y="222" font-family="system-ui" font-weight="bold" font-size="18" fill="#FFFFFF">Active</text>

    <rect x="280" y="170" width="160" height="65" rx="8" fill="#1C2541"/>
    <text x="295" y="195" font-family="system-ui" font-size="11" fill="#34D399">Grade Reports</text>
    <text x="295" y="222" font-family="system-ui" font-weight="bold" font-size="18" fill="#FFFFFF">Print-Ready</text>

    <rect x="460" y="170" width="160" height="65" rx="8" fill="#1C2541"/>
    <text x="475" y="195" font-family="system-ui" font-size="11" fill="#A78BFA">User Roles</text>
    <text x="475" y="222" font-family="system-ui" font-weight="bold" font-size="18" fill="#FFFFFF">3 Portals</text>

    <!-- Chart area -->
    <rect x="100" y="250" width="520" height="170" rx="8" fill="#1C2541"/>
    <path d="M 120 380 Q 200 320, 260 340 T 400 290 T 520 270 T 600 300 L 600 400 L 120 400 Z" fill="url(#chartGrad)"/>
    <path d="M 120 380 Q 200 320, 260 340 T 400 290 T 520 270 T 600 300" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <circle cx="400" cy="290" r="5" fill="#38BDF8"/>
    <circle cx="520" cy="270" r="5" fill="#38BDF8"/>
  </g>
</svg>
